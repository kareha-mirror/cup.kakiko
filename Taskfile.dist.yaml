version: "3"
env:
  CGO_ENABLED: 0
tasks:
  skk-edic-joyo:
    dir: skk-edic
    cmds:
      - >
        go run ../cmd/skk-edic-merge joyo/*.txt
        > ../cmd/kakiko/skk-edic-joyo.txt
  kihon:
    dir: skk-edic
    cmds:
      - go run ../cmd/skk-edic-merge kihon/*.txt > skk-edic-kihon.txt
  handcopy:
    dir: skk-edic/handcopy
    cmds:
      - >
        go run ../../cmd/skk-edic-merge
        station/config/skk-edic-diff.txt
        computer/config/skk-edic-diff.txt
        diary/config/skk-edic-diff.txt
        science/config/skk-edic-diff.txt
        world/config/skk-edic-diff.txt
        philosophy/config/skk-edic-diff.txt
        > skk-edic-handcopy.txt
  skk-edic-overlay:
    deps:
      - kihon
      - handcopy
    dir: skk-edic
    cmds:
      - >
        go run ../cmd/skk-edic-merge skk-edic-kihon.txt
        handcopy/skk-edic-handcopy.txt
        > ../cmd/kakiko/skk-edic-overlay.txt
  default:
    deps:
      - skk-edic-joyo
      - skk-edic-overlay
    cmds:
      - go build ./cmd/kakiko
  clean:
    cmds:
      - go run ./cmd/rm kakiko
      - go run ./cmd/rm kakiko.exe
      - go run ./cmd/rm cmd/kakiko/skk-edic-joyo.txt
      - go run ./cmd/rm cmd/kakiko/skk-edic-overlay.txt
      - go run ./cmd/rm skk-edic/skk-edic-kihon.txt
      - go run ./cmd/rm skk-edic/handcopy/skk-edic-handcopy.txt
  test:
    cmds:
      - go test ./...
  run:
    cmds:
      - go run ./cmd/kakiko
  fmt:
    cmds:
      - go fmt ./...
  vet:
    cmds:
      - go vet ./...
  check:
    cmds:
      - staticcheck ./...
  tidy:
    env:
      GOPRIVATE: tea.kareha.org
    cmds:
      - go get tea.kareha.org/cup/termi@latest
      - go mod tidy
  windows:
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -o kakiko.exe ./cmd/kakiko
  kk:
    cmds:
      - go run ./cmd/mkdir config
      - go run ./cmd/kakiko -joyo -d config
      - go run ./cmd/rm config
